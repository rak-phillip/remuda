  detail:
    title: Dev Environment
    access: Access
    url: URL
    password: Bootstrap password
    source: Source
    backendImage: Backend image
    rebuild: Rebuild UI
    rebuilding: Rebuilding
    delete: Delete
    networking: Networking
    hopRoute: Route
    hopAddressType: Address type
    resync: Re-sync networking
    resyncing: Re-syncing
    hopDrifted: >-
      This environment's cluster reports different ingress addresses than the
      management cluster is sending traffic to, which usually means a node was
      replaced. Re-syncing now.
    buildLogHint: Build logs are on the build job's pod in the target cluster.
    peek: Debug proxy

  confirmDelete:
    title: Delete {name}?
    body: >-
      This removes the environment's Rancher instance, its nginx deployment, its
      build job and all three of its volumes. Anything only stored inside the
      environment is lost, and it cannot be undone.
    cancel: Cancel

  warning:
    localCluster: >-
      This targets the local management cluster, which already runs this Rancher.
      A dev environment here competes for the same node's CPU, memory and disk.
      Prefer a downstream cluster where one is available.
    noStorageClass: >-
      This cluster has no StorageClass, so the environment's volumes can never be
      bound and the build will not start. Install node-local storage below, or
      name a class of your own under Show Advanced.
    noIssuer: >-
      No cert-manager ClusterIssuer was found on the cluster that terminates TLS
      for this environment, so it will be created without TLS and browsers will
      warn on every visit.
    noIngressEntry: >-
      Could not find an ingress controller on this cluster that is reachable from
      outside it, so the environment could not be given a working address. It
      needs an ingress controller answering HTTPS on a LoadBalancer, a NodePort or
      a host port.
    hopClassUnsupported: >-
      The management cluster's ingress controller ({ingressClass}) cannot be told
      to reach a backend over HTTPS without verifying its certificate, which is
      what fronting an environment on another cluster requires. traefik and nginx
      both can.
    hopIsPublic: >-
      This environment will be reached over its cluster's public address
      ({address}). Traffic between the two clusters is encrypted but its
      certificate is not verified, so treat the environment as exposed and do not
      put anything sensitive in it.
    noBaseDomain: >-
      No base domain could be derived. Set one below, and make sure a wildcard DNS
      record points at this cluster's ingress.

  error:
    createFailed: Could not create the environment
    loadFailed: Could not load environments
    deleteFailed: Could not delete the environment
    rebuildFailed: Could not start the rebuild
    storageInstallFailed: Could not install local-path storage on this cluster
    hostnameTaken: >-
      Another environment already uses this hostname. Names are shared across
      every cluster, because they all come from one wildcard DNS record -- pick a
      different one.
    resyncFailed: Could not re-sync this environment's networking
