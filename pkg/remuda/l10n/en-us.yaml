product:
  remuda: Remuda

remuda:
  nav:
    environments: Environments
    create: Create

  list:
    title: Dev Environments
    subtitle: Rancher instances running a dashboard branch, for QA and design review.
    emptyTitle: No dev environments yet
    empty: >-
      An environment runs a Rancher instance built from a dashboard branch, so QA
      and design can review work in progress at a shareable URL.
    createAction: Create
    delete: Delete
    start: Start
    starting: Starting
    stop: Stop
    stopping: Stopping
    incompleteHint: >-
      An environment below was recorded but never finished being created, so
      nothing is running for it. Delete it and create it again; the name stays
      reserved until you do.
    columns:
      name: Name
      cluster: Cluster
      branch: Branch
      owner: Owner
      backend: Backend
      build: UI build
      url: URL
      age: Age

  state:
    incomplete: Incomplete
    building: Building
    ready: Ready
    failed: Failed
    unknown: Unknown
    pending: Pending
    stopped: Stopped
    stopping: Stopping

  create:
    title: Create Dev Environment
    nameLabel: Name
    namePlaceholder: my-feature
    nameHint: Used as the subdomain and as the name of every object created.
    clusterLabel: Target cluster
    repoLabel: Repository
    repoPlaceholder: https://github.com/rancher/dashboard
    repoHint: >-
      Public repositories on github.com are checked as you type, and their
      branches offered in the Branch field. A private repository cannot be
      checked -- GitHub
      answers the same way for one that does not exist -- so name its token
      secret under Show Advanced and the check is skipped.
    repoChecking: Checking repository...
    repoFound: Repository found.
    repoMissing: >-
      No public repository at this address. If it is private, name its token
      secret under Show Advanced -- the check is skipped for private
      repositories and the branch cannot be verified here.
    repoNotChecked: >-
      Not checked. A token secret is named, so this is treated as a private
      repository and is left to the build to resolve.
    branchLabel: Branch
    branchPlaceholder: feature/my-branch
    branchesAvailable: '{count} branches.'
    branchesPartial: >-
      Showing {count} branches. The repository has more, so searching here
      matches the start of a branch name.
    branchHint: >-
      Type any part of a branch name to filter the list. A repository with too
      many branches to load in full is searched by the start of the name
      instead. Any branch name can be typed in full, whether it is listed or
      not.
    gitSecretLabel: Git token secret
    gitSecretHint: Only needed for a private fork. Secret must hold a "token" key.
    backendLabel: Rancher server image
    backendHint: Derived from the branch when it names a release line, otherwise head.
    hostnameLabel: Hostname
    sizes: Volume sizes (GiB)
    dataSize: Rancher data
    uiSize: UI bundle
    cacheSize: Build cache
    clusterConfig: Cluster configuration
    baseDomain: Base domain
    baseDomainHint: >-
      Requires a wildcard DNS record pointing at the ingress that serves this
      environment. A default derived from that cluster's own address resolves
      without one.
    ingressClass: Ingress class
    storageClass: Storage class
    clusterIssuer: cert-manager ClusterIssuer
    issuerMirrored: >-
      This cluster has no ClusterIssuer, so Remuda will create its own
      cert-manager Issuer in the rancher-remuda namespace, copying the Let's
      Encrypt settings from {source}. That registers a new ACME account against
      the same email address. No other setup is needed.
    installStorage: Install local storage
    installingStorage: Installing
    submit: Create
    creating: Creating

  detail:
    title: Dev Environment
    access: Access
    url: URL
    password: Bootstrap password
    source: Source
    backendImage: Backend image
    rebuild: Rebuild UI
    rebuilding: Rebuilding
    start: Start
    starting: Starting
    stop: Stop
    stopping: Stopping
    delete: Delete
    stopped: >-
      This environment is stopped. Its volumes, hostname and bootstrap password
      are kept, so starting it gives back the same instance -- allow a few
      minutes for the nested cluster to finish coming up again. Its URL returns
      503 until then.
    stoppingHint: >-
      The backend is shutting down. It holds the data volume until its pod is
      gone, so starting again before then leaves the new pod waiting on the
      volume.
    incomplete: >-
      This environment was recorded but never finished being created, so nothing
      is running for it. Delete it and create it again.
    share: Use this build elsewhere
    shareIndex: ui-dashboard-index
    shareHint: >-
      Point another Rancher's ui-dashboard-index setting at this URL to run it
      against this branch build, the way a *-dev bundle on the CDN would be used.
      It serves whatever this environment's most recent successful build
      produced, and it stops answering when the environment is stopped or
      deleted.
    shareUntrusted: >-
      This environment has no certificate issuer, so it is served with a
      self-signed certificate. A Rancher on another host fetches this index
      server-side and will reject that certificate. Recreate the environment
      against a cluster issuer to share the build off this host.
    networking: Networking
    hopRoute: Route
    hopAddressType: Address type
    resync: Re-sync networking
    resyncing: Re-syncing
    hopDrifted: >-
      This environment's cluster reports different ingress addresses than the
      management cluster is sending traffic to, which usually means a node was
      replaced. Re-syncing now.
    hopSelfHealHint: >-
      Networking is re-checked every 15 seconds while this page is open and in
      the foreground. Browsers throttle background tabs, so an environment whose
      node is replaced while nobody is looking stays unreachable until this page
      is opened again.
    directRoute: Served by
    directDrifted: >-
      This environment's cluster now answers on {address}, which is not the
      address in its hostname. The address is also baked into the UI bundle at
      build time, so this cannot be repointed -- create the environment again to
      pick up the new one.
    directHint: >-
      The management cluster is not in the path for this environment: its
      hostname resolves to its own cluster's ingress, which serves it directly.
    buildLogHint: Build logs are on the build job's pod in the target cluster.
    peek: Debug proxy

  confirmDelete:
    title: Delete {name}?
    body: >-
      This removes the environment's Rancher instance, its nginx deployment, its
      build job and all three of its volumes. Anything only stored inside the
      environment is lost, and it cannot be undone.
    cancel: Cancel

  warning:
    noController: >-
      This Rancher has no Remuda controller, which is what builds an environment
      once you ask for one. Install the remuda-controller chart from Apps, from
      the same repository this extension came from, then reload this page.
    localCluster: >-
      This targets the local management cluster, which already runs this Rancher.
      A dev environment here competes for the same node's CPU, memory and disk.
      Prefer a downstream cluster where one is available.
    noStorageClass: >-
      This cluster has no StorageClass, so the environment's volumes can never be
      bound and the build will not start. Install node-local storage here, or
      name a class of your own under Show Advanced.
    noIssuer: >-
      No cert-manager ClusterIssuer was found on the cluster that terminates TLS
      for this environment, so it will be created without TLS and browsers will
      warn on every visit.
    repoInvalid: >-
      This does not look like a repository the build can clone. It needs the
      repository name as well as the owner, for example
      https://github.com/rancher/dashboard.
    noIngressEntry: >-
      Could not find an ingress controller on this cluster that is reachable from
      outside it, so the environment could not be given a working address. It
      needs an ingress controller answering HTTPS on a LoadBalancer, a NodePort or
      a host port.
    noIngressClass: >-
      This cluster has no IngressClass, so the environment's Ingress cannot be
      created and nothing would ever serve it. Install an ingress controller here,
      or name a class of your own under Show Advanced.
    noIngressClassLocal: >-
      The local cluster has no IngressClass, so nothing here can serve an
      environment. A Rancher running in Docker cannot usefully be given one
      either: its k3s starts with traefik and servicelb disabled, and the
      container publishes only the Rancher server's own ports. Create the
      environment on a downstream cluster instead.
    hopIsPublic: >-
      This environment will be reached over its cluster's public address
      ({address}). Traffic between the two clusters is encrypted but its
      certificate is not verified, so treat the environment as exposed and do not
      put anything sensitive in it.
    directExposure: >-
      {reason} This environment will instead be reached directly on its own
      cluster's ingress, at {hostname}.
    directWildcard: >-
      That name comes from {suffix}, a public DNS service that resolves any
      address embedded in a name, so nothing has to be registered for it to
      work. The address is part of the hostname and is baked into the UI bundle
      when it is built, so replacing the cluster's node ({address}) means
      recreating the environment. Set a base domain of your own below to use a
      name you control instead.
    directIsPublic: >-
      This environment answers on its cluster's public address ({address}), so it
      is reachable from the internet by anyone who knows the name. Treat it as
      exposed and do not put anything sensitive in it.
    noBaseDomain: >-
      No base domain could be derived. Set one below, and make sure a wildcard DNS
      record points at this cluster's ingress.
    baseDomainIsIp: >-
      {baseDomain} is an address, not a domain, so the environment's hostname
      resolves nowhere and no DNS record can change that. Set a base domain that
      can carry a subdomain.
    wildcardNoAddress: >-
      Nothing resolves under {derived}, and no address could be derived to fall
      back to, so an environment named beneath it would be unreachable. Add a
      wildcard DNS record for *.{derived} pointing at this cluster's ingress, or
      set a base domain of your own below.
    wildcardMissing: >-
      Nothing resolves under {derived}, so an environment named beneath it would
      be unreachable and its certificate would never issue. Using {baseDomain}
      instead, which resolves to this cluster's ingress with no DNS to set up.
      Add a wildcard record for *.{derived} pointing at that ingress and this
      field goes back to using it.

  reason:
    noHostIngress: >-
      The management cluster has no ingress controller, so it cannot front an
      environment running on another cluster.
    hostClassUnsupported: >-
      The management cluster's ingress controller cannot be told to reach a
      backend over HTTPS without verifying its certificate, which is what
      fronting an environment on another cluster requires.
    baseDomainIsIp: >-
      This Rancher is reached by address rather than by name, so there is no
      domain to give an environment a hostname under.

  error:
    createFailed: Could not create the environment
    loadFailed: Could not load environments
    deleteFailed: Could not delete the environment
    rebuildFailed: Could not start the rebuild
    storageInstallFailed: Could not install local-path storage on this cluster
    controllerMissing: >-
      The Remuda controller is not installed, so nothing would build this
      environment. Install the remuda-controller chart and try again.
    hostnameTaken: >-
      Another environment already uses this hostname. Names are shared across
      every cluster, because they all come from one wildcard DNS record -- pick a
      different one.
    resyncFailed: Could not re-sync this environment's networking
    startFailed: Could not start the environment
    stopFailed: Could not stop the environment
