# Lint, test and *build* the extension.
#
# The build is the part that matters here. `yarn test` runs through babel, which
# strips types without checking them, so type errors are invisible to it -- and
# the upstream publish script does not propagate a failed build, it packages an
# empty bundle and carries on. A release therefore looks green while shipping an
# extension with no JavaScript in it. Building here is what makes that loud.
name: CI

on:
  # release-candidate as well as main: a candidate is tagged from that branch,
  # and a tag is a bad place for CI to see the code for the first time. 0.2.0-rc.1
  # shipped a type error to a release run because a branch push ran nothing --
  # `yarn test` is babel-jest and strips types without checking them, so the build
  # step here is the only thing that catches them.
  push:
    branches: [main, release-candidate]
    # deploy/** is not ignored: the controller chart carries a version that has
    # to stay in step with the packages, and the check above is what enforces it.
    paths-ignore: ['controller/**', '**.md']
  pull_request:
    paths-ignore: ['controller/**', '**.md']
  workflow_dispatch:

defaults:
  run:
    shell: bash
    working-directory: ./

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Catches a hand-edited version on the commit that caused it, rather than
      # at tag time. v0.1.2's tag failed because the controller chart was left
      # behind by a manual bump.
      - name: Check every file agrees on a version
        run: scripts/bump-version --check

      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          cache: yarn
          node-version-file: '.nvmrc'

      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn test

      - name: Build the extension
        run: yarn build-pkg remuda

      - name: Check the bundle is not empty
        run: |
          set -euo pipefail

          version=$(jq -r .version pkg/remuda/package.json)
          bundle="dist-pkg/remuda-${version}/remuda-${version}.umd.min.js"

          if [[ ! -s "$bundle" ]]; then
            echo "::error::$bundle is missing or empty. The build produced no extension code."
            ls -la "dist-pkg/remuda-${version}" || true
            exit 1
          fi

          echo "$bundle is $(stat -c%s "$bundle") bytes"
