name: Controller

# CI only. Publishing the image and the chart lives in release.yml, so there is
# exactly one place a tag turns into artifacts.
on:
  # release-candidate as well as main -- see the note in ci.yml.
  push:
    branches: [main, release-candidate]
    paths: ['controller/**', 'deploy/chart/**', '.github/workflows/controller.yml']
  pull_request:
    paths: ['controller/**', 'deploy/chart/**', '.github/workflows/controller.yml']
  workflow_dispatch:

defaults:
  run:
    shell: bash
    working-directory: ./controller

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: controller/go.mod
          cache-dependency-path: controller/go.sum

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  chart:
    name: Lint chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: v3.14.0

      - run: helm lint ../deploy/chart/remuda-controller

      # Rendering catches template errors that lint alone lets through.
      - run: helm template remuda-controller ../deploy/chart/remuda-controller > /dev/null

