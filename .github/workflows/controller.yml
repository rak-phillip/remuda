name: Controller

on:
  push:
    branches: [main]
    paths: ['controller/**', 'deploy/chart/**', '.github/workflows/controller.yml']
  pull_request:
    paths: ['controller/**', 'deploy/chart/**', '.github/workflows/controller.yml']
  release:
    types: [released]
  workflow_dispatch:

# The image is versioned in step with the chart, so a release publishes both.
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/remuda-controller

defaults:
  run:
    shell: bash
    working-directory: ./controller

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: controller/go.mod
          cache-dependency-path: controller/go.sum

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  chart:
    name: Lint chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - run: helm lint ../deploy/chart/remuda-controller

      # Rendering catches template errors that lint alone lets through.
      - run: helm template remuda-controller ../deploy/chart/remuda-controller > /dev/null

  image:
    name: Build and push image
    needs: [test, chart]
    # Only publish from the canonical repo, and never from a fork's pull request.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: ./controller
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
