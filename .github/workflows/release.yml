# One tag ships everything.
#
#   git tag v0.1.0 && git push --tags
#
# The Rancher extension tooling validates the release tag against
# "<package name>-<version>" and cancels its own run when it does not match, so
# the `version` job derives `remuda-0.1.0` from `v0.1.0` and passes that down.
# The upstream scripts never see the `v` form.
name: Release

on:
  push:
    tags: ['v*']
  # Re-runnable from a tag ref. Dispatching from a branch builds nothing: the
  # reusable workflows only publish when github.ref_type is 'tag'.
  workflow_dispatch:

defaults:
  run:
    shell: bash
    working-directory: ./

jobs:
  version:
    name: Derive and check the version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      tagged_release: ${{ steps.v.outputs.tagged_release }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      pages_branch: ${{ steps.v.outputs.pages_branch }}
    steps:
      - uses: actions/checkout@v7

      - id: v
        name: Derive the version and check every file agrees
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$tag' is not vX.Y.Z"
            exit 1
          fi

          # The script owns the list of files that carry a version. Repeating it
          # here would let the two drift, and the only signal would be a failed
          # release.
          scripts/bump-version --check "$version"

          # The extension package name; what the Rancher scripts match against.
          name=$(jq -r .name pkg/remuda/package.json)

          # Which release train this tag belongs to.
          #
          # A SemVer pre-release suffix is the whole signal: v0.2.0-rc.1 is a
          # candidate, v0.2.0 is production. They publish the same artifacts by
          # the same jobs -- a candidate is a full release, not a partial one --
          # and differ in exactly two places: which Helm repository they land in,
          # and whether they are allowed to move the `latest` image tag.
          #
          # Relying on Helm hiding pre-releases from `helm search` was considered
          # and rejected: it would put a candidate in the same index the
          # Extensions screen reads, and whether *that* filters pre-releases is
          # not something this repository gets to decide.
          if [[ "$version" == *-* ]]; then
            prerelease=true
            pages_branch=gh-pages-rc
          else
            prerelease=false
            pages_branch=gh-pages
          fi

          {
            echo "version=$version"
            echo "tagged_release=${name}-${version}"
            echo "prerelease=$prerelease"
            echo "pages_branch=$pages_branch"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing $version as ${name}-${version} into ${pages_branch}"

  # The publish script does not propagate a failed extension build -- it packages
  # an empty bundle and reports success, so a release can look green while
  # shipping no JavaScript. v0.1.0 did exactly that. Building here first is what
  # stops it happening again.
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          cache: yarn
          node-version-file: '.nvmrc'

      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn test
      - run: yarn build-pkg remuda

      - name: Check the bundle is not empty
        run: |
          set -euo pipefail

          version=$(jq -r .version pkg/remuda/package.json)
          bundle="dist-pkg/remuda-${version}/remuda-${version}.umd.min.js"

          if [[ ! -s "$bundle" ]]; then
            echo "::error::$bundle is missing or empty. Refusing to publish an extension with no code."
            exit 1
          fi

          echo "$bundle is $(stat -c%s "$bundle") bytes"

  # Publishes the Helm repository the Extensions screen installs from: the
  # extension chart and the controller chart, in one commit.
  #
  # One commit because the extension's onLogin hook upgrades the controller to
  # exactly the extension's version, and gives up if no repository lists it. Two
  # pushes leave a window where Rancher can fetch an index offering the new
  # extension without its controller. v0.3.0's was 16 minutes -- the controller
  # image build -- and a Rancher that refreshed inside it kept the old
  # controller until the repository was refreshed by hand. The same gap was in
  # every release before it.
  #
  # Not the upstream build-extension-charts.yml, for two reasons:
  # - Its index is merged from a copy of index.yaml downloaded from
  #   raw.githubusercontent.com, which is cached for minutes. Publishing after
  #   the controller could rewrite the index from a copy that predates it and
  #   drop the controller entry. The index here is merged from the branch as
  #   checked out.
  # - Its chart-releaser step has a `pages_branch` that defaults to `gh-pages`
  #   and is not exposed, so a candidate's index leaked into production
  #   (v0.2.0-rc.2). Here that step runs for production releases only.
  #
  # After controller-image, so the index never offers a chart whose image does
  # not exist yet.
  charts:
    name: Helm repository
    needs: [version, verify, controller-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The pages branch at the workspace root, as chart-releaser expects; the
      # source beside it. Full history so the commit step can rebase.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.pages_branch }}
          fetch-depth: 0

      - uses: actions/checkout@v7
        with:
          path: source

      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          cache: yarn
          cache-dependency-path: source/yarn.lock
          node-version-file: source/.nvmrc

      # Pinned to what the upstream workflow uses, so the extension chart is
      # packaged exactly as it was before this job replaced it.
      - uses: azure/setup-helm@v5
        with:
          version: v3.8.0

      - run: yarn install --frozen-lockfile
        working-directory: ./source

      - name: Build and package the extension
        working-directory: ./source
        run: |
          set -euo pipefail

          yarn publish-pkgs \
            -s '${{ github.repository }}' \
            -b '${{ needs.version.outputs.pages_branch }}' \
            -t '${{ needs.version.outputs.tagged_release }}'

      - name: Check the extension actually built
        working-directory: ./source
        run: |
          set -euo pipefail

          tag='${{ needs.version.outputs.tagged_release }}'
          version='${{ needs.version.outputs.version }}'
          name="${tag%-"$version"}"

          chart="tmp/assets/${name}/${tag}.tgz"
          bundle="tmp/extensions/${name}/${version}/plugin/${tag}.umd.min.js"

          for f in "$chart" "$bundle"; do
            if [[ ! -s "$f" ]]; then
              echo "::error::$f is missing or empty. publish-pkgs did not build ${tag}."
              exit 1
            fi
            echo "$f is $(stat -c%s "$f") bytes"
          done

      - name: Add both charts and rebuild the index
        run: |
          set -euo pipefail

          # Everything publish-pkgs built except its index.yaml, which it merged
          # from the possibly stale download described above. `<dir>/.` merges
          # into the directories already on the branch rather than nesting.
          for d in assets charts extensions; do
            mkdir -p "$d"
            cp -r "source/tmp/$d/." "$d/"
          done

          helm package source/deploy/chart/remuda-controller -d assets/remuda-controller

          # --url assets/ keeps entries relative, as the extension publish
          # writes them; --merge keeps every entry already on the branch.
          merge=()
          [[ -f index.yaml ]] && merge=(--merge index.yaml)
          helm repo index assets --url assets/ "${merge[@]}"
          mv assets/index.yaml index.yaml

      # The guarantee this job exists for, checked rather than assumed.
      - name: Check the index lists both at this version
        run: |
          set -euo pipefail

          version='${{ needs.version.outputs.version }}'

          for chart in remuda remuda-controller; do
            url="assets/${chart}/${chart}-${version}.tgz"
            if ! grep -qF -- "- ${url}" index.yaml; then
              echo "::error::index.yaml does not list ${url}"
              exit 1
            fi
            echo "index.yaml lists ${url}"
          done

      - name: Commit
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add assets charts extensions index.yaml

          if git diff --cached --quiet; then
            echo "Nothing to publish; this version is already in the index."
            exit 0
          fi

          git commit -m "Add remuda and remuda-controller ${{ needs.version.outputs.version }}"
          git pull --rebase origin "${{ needs.version.outputs.pages_branch }}"
          git push origin "${{ needs.version.outputs.pages_branch }}"

      # The GitHub release (remuda-<version>, with the chart attached) the
      # upstream workflow made. After the push, so the index it reads already
      # lists this version and it has nothing to add. Never for a candidate:
      # see the note above this job.
      - name: Run chart-releaser
        if: needs.version.outputs.prerelease == 'false'
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          charts_dir: ./charts/*
        env:
          CR_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          CR_SKIP_EXISTING: true

  # The air-gapped install path: Extensions -> Manage Extension Catalogs.
  catalog:
    name: Extension catalog image
    needs: [version, verify]
    uses: rancher/dashboard/.github/workflows/build-extension-catalog.yml@master
    permissions:
      actions: write
      contents: read
      packages: write
    with:
      registry_target: ghcr.io
      registry_user: ${{ github.actor }}
      tagged_release: ${{ needs.version.outputs.tagged_release }}
    secrets:
      registry_token: ${{ secrets.GITHUB_TOKEN }}

  controller-image:
    name: Controller image
    needs: [version, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/remuda-controller
          # type=semver already declines to emit {{major}}.{{minor}} for a
          # pre-release. `latest` is raw and would move unconditionally, so it is
          # gated by hand -- a release candidate must never become what an
          # unpinned `helm install` pulls.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease == 'false' }}

      - uses: docker/build-push-action@v7
        with:
          context: ./controller
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
