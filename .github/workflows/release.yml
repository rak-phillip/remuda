# One tag ships everything.
#
#   git tag v0.1.0 && git push --tags
#
# The Rancher extension tooling validates the release tag against
# "<package name>-<version>" and cancels its own run when it does not match, so
# the `version` job derives `remuda-0.1.0` from `v0.1.0` and passes that down.
# The upstream scripts never see the `v` form.
name: Release

on:
  push:
    tags: ['v*']
  # Re-runnable from a tag ref. Dispatching from a branch builds nothing: the
  # reusable workflows only publish when github.ref_type is 'tag'.
  workflow_dispatch:

defaults:
  run:
    shell: bash
    working-directory: ./

jobs:
  version:
    name: Derive and check the version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      tagged_release: ${{ steps.v.outputs.tagged_release }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      pages_branch: ${{ steps.v.outputs.pages_branch }}
    steps:
      - uses: actions/checkout@v7

      - id: v
        name: Derive the version and check every file agrees
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$tag' is not vX.Y.Z"
            exit 1
          fi

          # The script owns the list of files that carry a version. Repeating it
          # here would let the two drift, and the only signal would be a failed
          # release.
          scripts/bump-version --check "$version"

          # The extension package name; what the Rancher scripts match against.
          name=$(jq -r .name pkg/remuda/package.json)

          # Which release train this tag belongs to.
          #
          # A SemVer pre-release suffix is the whole signal: v0.2.0-rc.1 is a
          # candidate, v0.2.0 is production. They publish the same artifacts by
          # the same jobs -- a candidate is a full release, not a partial one --
          # and differ in exactly two places: which Helm repository they land in,
          # and whether they are allowed to move the `latest` image tag.
          #
          # Relying on Helm hiding pre-releases from `helm search` was considered
          # and rejected: it would put a candidate in the same index the
          # Extensions screen reads, and whether *that* filters pre-releases is
          # not something this repository gets to decide.
          if [[ "$version" == *-* ]]; then
            prerelease=true
            pages_branch=gh-pages-rc
          else
            prerelease=false
            pages_branch=gh-pages
          fi

          {
            echo "version=$version"
            echo "tagged_release=${name}-${version}"
            echo "prerelease=$prerelease"
            echo "pages_branch=$pages_branch"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing $version as ${name}-${version} into ${pages_branch}"

  # The publish script does not propagate a failed extension build -- it packages
  # an empty bundle and reports success, so a release can look green while
  # shipping no JavaScript. v0.1.0 did exactly that. Building here first is what
  # stops it happening again.
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          cache: yarn
          node-version-file: '.nvmrc'

      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn test
      - run: yarn build-pkg remuda

      - name: Check the bundle is not empty
        run: |
          set -euo pipefail

          version=$(jq -r .version pkg/remuda/package.json)
          bundle="dist-pkg/remuda-${version}/remuda-${version}.umd.min.js"

          if [[ ! -s "$bundle" ]]; then
            echo "::error::$bundle is missing or empty. Refusing to publish an extension with no code."
            exit 1
          fi

          echo "$bundle is $(stat -c%s "$bundle") bytes"

  # Publishes the Helm repository the Extensions screen installs from.
  #
  # Production only. The last step of the upstream workflow is
  # helm/chart-releaser-action, whose `pages_branch` defaults to `gh-pages` and
  # which build-extension-charts.yml does not expose as an input -- so it writes
  # the index to `gh-pages` whatever `target_branch` says. Correct for a
  # production release; a leak for a candidate. v0.2.0-rc.2 landed in the
  # production index this way and had to be reverted by hand. Candidates go
  # through `charts-rc` instead.
  charts:
    name: Extension chart
    needs: [version, verify]
    if: needs.version.outputs.prerelease == 'false'
    uses: rancher/dashboard/.github/workflows/build-extension-charts.yml@master
    permissions:
      contents: write
      pull-requests: write
    with:
      target_branch: ${{ needs.version.outputs.pages_branch }}
      tagged_release: ${{ needs.version.outputs.tagged_release }}

  charts-rc:
    name: Extension chart (candidate)
    needs: [version, verify]
    if: needs.version.outputs.prerelease == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: source

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.pages_branch }}
          path: pages
          # Full history so the commit step can rebase before pushing.
          fetch-depth: 0

      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          cache: yarn
          cache-dependency-path: source/yarn.lock
          node-version-file: source/.nvmrc

      # Pinned to what the upstream workflow uses, so a candidate's chart is
      # packaged by the same helm that will package the production release.
      - uses: azure/setup-helm@v5
        with:
          version: v3.8.0

      - run: yarn install --frozen-lockfile
        working-directory: ./source

      - name: Build and package the extension
        working-directory: ./source
        run: |
          set -euo pipefail

          yarn publish-pkgs \
            -s '${{ github.repository }}' \
            -b '${{ needs.version.outputs.pages_branch }}' \
            -t '${{ needs.version.outputs.tagged_release }}'

      - name: Check the candidate actually built
        working-directory: ./source
        run: |
          set -euo pipefail

          tag='${{ needs.version.outputs.tagged_release }}'
          version='${{ needs.version.outputs.version }}'
          name="${tag%-"$version"}"

          chart="tmp/assets/${name}/${tag}.tgz"
          bundle="tmp/extensions/${name}/${version}/plugin/${tag}.umd.min.js"

          for f in "$chart" "$bundle"; do
            if [[ ! -s "$f" ]]; then
              echo "::error::$f is missing or empty. publish-pkgs did not build ${tag}."
              exit 1
            fi
            echo "$f is $(stat -c%s "$f") bytes"
          done

      - name: Commit
        run: |
          set -euo pipefail

          # `cp -r <dir>/. <dest>/` merges into the directories already on the
          # branch rather than nesting inside them.
          cp -r source/tmp/. pages/

          cd pages

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add assets charts extensions index.yaml

          if git diff --cached --quiet; then
            echo "Nothing to publish; this version is already in the index."
            exit 0
          fi

          git commit -m "Add ${{ needs.version.outputs.tagged_release }}"
          git pull --rebase origin "${{ needs.version.outputs.pages_branch }}"
          git push origin "${{ needs.version.outputs.pages_branch }}"

  # The air-gapped install path: Extensions -> Manage Extension Catalogs.
  catalog:
    name: Extension catalog image
    needs: [version, verify]
    uses: rancher/dashboard/.github/workflows/build-extension-catalog.yml@master
    permissions:
      actions: write
      contents: read
      packages: write
    with:
      registry_target: ghcr.io
      registry_user: ${{ github.actor }}
      tagged_release: ${{ needs.version.outputs.tagged_release }}
    secrets:
      registry_token: ${{ secrets.GITHUB_TOKEN }}

  controller-image:
    name: Controller image
    needs: [version, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/remuda-controller
          # type=semver already declines to emit {{major}}.{{minor}} for a
          # pre-release. `latest` is raw and would move unconditionally, so it is
          # gated by hand -- a release candidate must never become what an
          # unpinned `helm install` pulls.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease == 'false' }}

      - uses: docker/build-push-action@v7
        with:
          context: ./controller
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Adds the controller chart to the same Helm repository as the extension, so
  # one Index URL serves both. Strictly after whichever extension-chart job ran:
  # both push to the same branch, and running them together would race.
  controller-chart:
    name: Controller chart
    needs: [version, charts, charts-rc, controller-image]
    # Exactly one of `charts` / `charts-rc` runs, so the default "skip if a
    # dependency was skipped" would skip this job on every release. Run unless
    # something actually went wrong.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: source

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.pages_branch }}
          path: pages
          # Full history: the commit step rebases onto whatever the extension
          # job just pushed, and `git pull --rebase` cannot work on a shallow
          # clone.
          fetch-depth: 0

      - uses: azure/setup-helm@v5
        with:
          version: v3.14.0

      - name: Package the chart and merge it into the index
        working-directory: ./pages
        run: |
          set -euo pipefail

          helm package ../source/deploy/chart/remuda-controller -d assets/remuda-controller

          # --url assets/ keeps entries relative, matching what the extension
          # publish writes; --merge preserves the extension's own entries.
          merge=()
          [[ -f index.yaml ]] && merge=(--merge index.yaml)
          helm repo index assets --url assets/ "${merge[@]}"
          mv assets/index.yaml index.yaml

      - name: Commit
        working-directory: ./pages
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add assets index.yaml

          if git diff --cached --quiet; then
            echo "Nothing to publish; this version is already in the index."
            exit 0
          fi

          git commit -m "Add remuda-controller ${{ needs.version.outputs.version }}"

          # The extension job pushed to this branch moments ago, so rebase
          # rather than assume the checkout is still current.
          git pull --rebase origin "${{ needs.version.outputs.pages_branch }}"
          git push origin "${{ needs.version.outputs.pages_branch }}"
