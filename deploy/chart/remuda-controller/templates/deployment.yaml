apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "remuda-controller.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "remuda-controller.labels" . | nindent 4 }}
spec:
  # Single writer. Two replicas would race to write the same EndpointSlices for
  # no benefit -- the work is trivial and entirely I/O bound on the API server.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "remuda-controller.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "remuda-controller.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "remuda-controller.name" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -interval={{ .Values.interval }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
