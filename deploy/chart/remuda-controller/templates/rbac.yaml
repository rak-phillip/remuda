# Cluster-scoped, and the reason this controller needs no downstream credentials
# at all: it reads what Rancher already publishes about other clusters, and
# delivers to them through Fleet, which pulls rather than being pushed to.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "remuda-controller.name" . }}
  labels:
    {{- include "remuda-controller.labels" . | nindent 4 }}
rules:
  # Mirrored downstream nodes. This is what lets the hop resync run with no
  # downstream credentials: Rancher publishes every cluster's node addresses
  # here, namespaced by cluster ID.
  - apiGroups: ["management.cattle.io"]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  # Read-only, and for exactly two things: spec.fleetWorkspaceName, which says
  # which namespace a cluster's Bundle belongs in, and the cluster's existence,
  # which is what turns a typo in spec.clusterId into a condition rather than a
  # silent no-op.
  - apiGroups: ["management.cattle.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch"]
  # What the host cluster is, read from the host cluster.
  #
  # These replace the remuda-config ConfigMap, which the extension writes to the
  # cluster an environment *targets* while this controller only ever reads the
  # host -- so every downstream environment stalled on defaults that were never
  # going to arrive. A downstream environment's hop is fronted by the host's
  # ingress and its TLS terminates on the host's issuer, and no field on the spec
  # can supply either, so this controller has to be able to see them itself.
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  # Cluster-wide, unlike the namespaced Issuer rule below, because the issuer
  # worth mirroring is the one Rancher provisions for itself in cattle-system.
  - apiGroups: ["cert-manager.io"]
    resources: ["clusterissuers", "issuers"]
    verbs: ["get", "list", "watch"]
  # Nodes for spec.podCIDR, which is how the nested k3s gets ranges that do not
  # collide with the host's. Addresses are not read here -- a downstream node's
  # come from management.cattle.io above.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  # Exactly two objects each, by name. The service CIDR is not published
  # anywhere, so the ClusterIP of default/kubernetes stands in for it; server-url
  # is the host's own domain and server-version picks the backend image.
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["kubernetes"]
    verbs: ["get"]
  - apiGroups: ["management.cattle.io"]
    resources: ["settings"]
    resourceNames: ["server-url", "server-version"]
    verbs: ["get"]
  # How an environment reaches a cluster this controller has no credentials for:
  # a Bundle here, applied there by the Fleet agent that every registered cluster
  # already runs. Cluster-scoped because a Bundle lives in whichever Fleet
  # workspace its cluster belongs to -- fleet-local for the host, fleet-default
  # for the rest, and whatever an operator has moved a cluster into.
  #
  # `delete` is here and nowhere else in this chart. Every other object an
  # environment is made of carries an owner reference back to it, so deleting the
  # Environment collects them; a Bundle sits in a different namespace, which
  # Kubernetes forbids an owner reference to cross, so nothing collects it and
  # this controller has to. See reapBundles.
  - apiGroups: ["fleet.cattle.io"]
    resources: ["bundles"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "remuda-controller.name" . }}
  labels:
    {{- include "remuda-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "remuda-controller.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "remuda-controller.name" . }}
    namespace: {{ .Release.Namespace }}
---
# Everything else is namespaced to where the hops live, and deliberately narrow:
# Services are only ever read, and EndpointSlices are the sole thing written.
# The Ingress and ServersTransport stay the extension's to own.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "remuda-controller.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "remuda-controller.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  # EndpointSlices were update-only when the extension created them. The
  # controller builds the hop itself now, so a downstream environment created
  # from kubectl is reachable rather than merely deployed.
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch", "create", "update"]
  # traefik's answer to "reach the upstream over HTTPS without verifying it".
  # nginx does the same job with an Ingress annotation and no object at all, so
  # this is only ever created on a traefik host.
  - apiGroups: ["traefik.io"]
    resources: ["serverstransports"]
    verbs: ["get", "list", "watch", "create"]
  # The scriptable API. Read-only on the spec -- what the controller reports goes
  # to the status subresource, which is why that is the only thing it can write.
  - apiGroups: ["remuda.rancher.io"]
    resources: ["environments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["remuda.rancher.io"]
    resources: ["environments/status"]
    verbs: ["get", "update", "patch"]
  # What an environment is made of. No `delete` anywhere: every object carries an
  # owner reference back to its Environment, so removing that collects the lot --
  # build pods included, which a hand-rolled sweep has to chase separately
  # because a DELETE on a Job defaults to Orphan propagation.
  #
  # `update` only on Deployments, because replicas is the one field the
  # controller owns after creation. Everything else is created and then left
  # alone: these are dev instances people poke at, and reverting a hand-raised
  # resource limit every 30 seconds would be worse than useless.
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "persistentvolumeclaims", "services"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create"]
  # Only ever the mirrored Issuer, and only on a cluster whose sole issuer is
  # namespaced. A ClusterIssuer already exists and is not the controller's to
  # create.
  - apiGroups: ["cert-manager.io"]
    resources: ["issuers"]
    verbs: ["get", "list", "watch", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "remuda-controller.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "remuda-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "remuda-controller.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "remuda-controller.name" . }}
    namespace: {{ .Release.Namespace }}
